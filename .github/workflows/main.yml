on:
  push:
    branches: [main]
name: Deploy on push
jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Each folder is the document root of its own subdomain
    # (david.kloetz.com, julia.kloetz.com, www.kloetz.com), so each is
    # synced to a separate server-dir below.
    steps:
      - name: Get latest code
        uses: actions/checkout@v6

      - name: Sync files /david
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: kloetz.com
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_password }}
          local-dir: david/
          server-dir: httpdocs/david/

      - name: Sync files /julia
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: kloetz.com
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_password }}
          local-dir: julia/
          server-dir: httpdocs/julia/

      - name: Sync files /www
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: kloetz.com
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_password }}
          local-dir: www/
          server-dir: httpdocs/www/
